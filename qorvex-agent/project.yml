name: QorvexAgent
options:
  bundleIdPrefix: com.qorvex
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    # Both targets derive their bundle IDs from this variable so a single
    # `xcodebuild QORVEX_AGENT_BUNDLE_ID=...` override renames the app and its
    # UI-test runner together and keeps them distinct. Needed when the default
    # `com.qorvex.agent` App ID is registered to another team, which blocks
    # automatic signing for everyone else.
    QORVEX_AGENT_BUNDLE_ID: com.qorvex.agent
targets:
  QorvexAgent:
    type: application
    platform: iOS
    sources:
      - App/
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: $(QORVEX_AGENT_BUNDLE_ID)
      GENERATE_INFOPLIST_FILE: "YES"
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: "NO"
  QorvexAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Sources/
    dependencies:
      - target: QorvexAgent
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(QORVEX_AGENT_BUNDLE_ID).uitests
      GENERATE_INFOPLIST_FILE: "YES"
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: "NO"
      SWIFT_OBJC_BRIDGING_HEADER: "Sources/BridgingHeader.h"
schemes:
  QorvexAgentUITests:
    build:
      targets:
        QorvexAgentUITests:
          test: true
    test:
      targets:
        - QorvexAgentUITests
